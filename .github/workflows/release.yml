name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        run: |
          cargo install cross --locked || true

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: |
          if [ "$RUNNER_OS" == "Linux" ] && [ "$TARGET" == "x86_64-unknown-linux-gnu" ]; then
            cargo build --release --all
          else
            cross build --release --all --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          if [ "$RUNNER_OS" == "Windows" ]; then
            tar -czf release/cogito-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release cogito.exe
          else
            tar -czf release/cogito-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release cogito
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cogito-${{ matrix.target }}
          path: release/*.tar.gz

  create-release:
    name: Create Release
    needs: [release]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create checksums
        run: |
          cd cogito-*
          sha256sum * > checksums.txt
          cd ..

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cogito-*/checksums.txt
            cogito-*/*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable
        with:
          components: cargo

      - name: Publish
        run: |
          cargo login ${{ secrets.CRATES_IO_TOKEN }}
          cargo publish --release --package cogito-core
          cargo publish --release --package cogito-cli
          cargo publish --release --package cogito-api
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  publish-docker:
    name: Publish Docker
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cogitoai/cogito
          tags: type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

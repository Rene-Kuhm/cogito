# Release
#
# Builds prebuilt binaries for Linux, macOS and Windows and attaches them to a
# GitHub Release. Nothing is published to crates.io or npm here; those are
# separate, deliberate steps.
#
# Triggered only by pushing a tag matching `v*`, or manually.
#
# Artifacts per release:
#
#   cogito-<version>-x86_64-unknown-linux-gnu.tar.gz    Linux x86_64 (glibc)
#   cogito-<version>-aarch64-unknown-linux-gnu.tar.gz   Linux arm64 (glibc)
#   cogito-<version>-x86_64-apple-darwin.tar.gz         macOS Intel
#   cogito-<version>-aarch64-apple-darwin.tar.gz        macOS Apple Silicon
#   cogito-<version>-x86_64-pc-windows-msvc.zip         Windows x86_64
#   cogito-checksums.txt                              SHA-256 of every artifact
#
# install.sh consumes these names.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: cogito

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p cogito-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="${BINARY_NAME}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="${BINARY_NAME}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cd dist && 7z a "${name}.zip" "${name}" >/dev/null
          rm -rf "${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > cogito-checksums.txt
          cat cogito-checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/cogito-checksums.txt
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Disabled until the user explicitly decides to publish.

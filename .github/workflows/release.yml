# Release
#
# Builds prebuilt binaries for Linux, macOS and Windows and attaches them to a
# GitHub Release. Publishing to crates.io, npm and Homebrew is gated and never
# runs automatically on a tag push; it requires a human decision and the
# corresponding secret to be set.
#
# Triggered only by pushing a tag matching `v*`, or manually.
#
# Artifacts per release:
#
#   cogito-<version>-x86_64-unknown-linux-gnu.tar.gz    Linux x86_64 (glibc)
#   cogito-<version>-aarch64-unknown-linux-gnu.tar.gz   Linux arm64 (glibc)
#   cogito-<version>-x86_64-apple-darwin.tar.gz         macOS Intel
#   cogito-<version>-aarch64-apple-darwin.tar.gz        macOS Apple Silicon
#   cogito-<version>-x86_64-pc-windows-msvc.zip         Windows x86_64
#   cogito-checksums.txt                              SHA-256 of every artifact
#
# install.sh consumes these names.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_crates:
        description: 'Publish to crates.io'
        required: false
        default: 'false'
        type: boolean
      publish_npm:
        description: 'Publish to npm'
        required: false
        default: 'false'
        type: boolean
      publish_homebrew:
        description: 'Update Homebrew tap'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: cogito

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p cogito-harness --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="${BINARY_NAME}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="${BINARY_NAME}-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}.exe" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          cd dist && 7z a "${name}.zip" "${name}" >/dev/null
          rm -rf "${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > cogito-checksums.txt
          cat cogito-checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/cogito-checksums.txt
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_crates == 'true'
    steps:
      # The secret cannot be tested in a job-level `if`: GitHub rejects the whole
      # file when it is, and the run fails before any job starts.
      - name: Check the crates.io token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish cogito-harness-core
        run: |
          if cargo search cogito-harness-core --limit 1 | grep -q '"name":"cogito-harness-core"'; then
            echo "cogito-harness-core is already on crates.io, skipping"
          else
            cargo publish -p cogito-harness-core
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish cogito-harness
        run: cargo publish -p cogito-harness
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: [release]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_npm == 'true'
    defaults:
      run:
        working-directory: packages/cogito-harness
    steps:
      - name: Check the npm token
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - name: Publish
        if: steps.token.outputs.present == 'true'
        run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-homebrew:
    name: Update Homebrew tap
    needs: [release]
    runs-on: ubuntu-latest
    if: github.event.inputs.publish_homebrew == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tap configuration
        id: tap
        run: |
          if [[ -z "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set. Skipping tap update."
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [[ -z "${{ vars.HOMEBREW_TAP_REPO }}" ]]; then
            echo "HOMEBREW_TAP_REPO (repository variable) is not set. Skipping tap update."
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "configured=true" >> $GITHUB_OUTPUT
          echo "tap_repo=${{ vars.HOMEBREW_TAP_REPO }}" >> $GITHUB_OUTPUT

      - name: Render formula
        if: steps.tap.outputs.configured == 'true'
        id: formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          formula=$(./packaging/homebrew/render.sh "$version" dist/cogito-checksums.txt)
          echo "formula<<EOF" >> $GITHUB_OUTPUT
          echo "$formula" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Clone tap repository
        if: steps.tap.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.tap.outputs.tap_repo }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Update tap
        if: steps.tap.outputs.configured == 'true'
        env:
          FORMULA: ${{ steps.formula.outputs.formula }}
        run: |
          set -euo pipefail
          cd homebrew-tap
          echo "$FORMULA" > Formula/cogito.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cogito.rb
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "cogito ${{ github.ref_name }}"
          git push

[workspace]
resolver = "2"
members = [
    "crates/cogito-core",
    "crates/cogito-cli",
    "crates/cogito-api",

    "examples",
    "skills/cogito",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Cogito Team <hello@cogito.ai>"]
license = "Apache-2.0"
repository = "https://github.com/Rene-Kuhm/cogito"
homepage = "https://cogito.ai"
description = "Intelligent context harness for AI coding agents"
keywords = ["ai", "agents", "context", "optimization", "coding"]
categories = ["development-tools", "artificial-intelligence"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
walkdir = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
git2 = "0.20"
criterion = { version = "0.5", features = ["html_reports"] }
rusqlite = { version = "0.32", features = ["bundled", "modern_sqlite", "blob"] }
rmcp = { version = "1.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
toml_edit = "0.22"
syn = { version = "2", features = ["full", "extra-traits", "parsing"] }
quote = "1"
proc-macro2 = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.25"
tree-sitter-kotlin-ng = "1"
tree-sitter-swift = "0.7"
whoami = "1"
clap = { version = "4", features = ["derive", "env"] }
colored = "2"
indicatif = "0.17"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = "1"

# Internal crates
cogito-core = { path = "crates/cogito-core" }
cogito-cli = { path = "crates/cogito-cli" }
cogito-api = { path = "crates/cogito-api" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
